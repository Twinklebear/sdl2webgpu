name: Build

on:
  push:
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt install -y libsdl2-dev libx11-xcb-dev python3

      - name: Configure
        working-directory: ${{ github.workspace }}/example
        run: |
          mkdir cmake-build
          cd cmake-build
          cmake ..

      - name: Build
        working-directory: ${{ github.workspace }}/example/cmake-build
        run: make -j `nproc`

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: vcpkg install sdl2:x64-windows

      - name: Configure
        working-directory: ${{ github.workspace }}/example
        run: |
          mkdir cmake-build
          cd cmake-build
          cmake -A x64 ${env:GITHUB_WORKSPACE}/example/ `
            -G "Visual Studio 17 2022" `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        working-directory: ${{ github.workspace }}/example/cmake-build
        run: cmake --build . --config release

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: brew install sdl2

      - name: Configure
        working-directory: ${{ github.workspace }}/example
        run: |
          mkdir cmake-build
          cd cmake-build
          cmake ..

      - name: Build
        working-directory: ${{ github.workspace }}/example/cmake-build
        run: make -j 4

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 5.0.1
          ./emsdk activate 5.0.1

      - name: Configure
        working-directory: ${{ github.workspace }}/example
        run: |
          source ${{ github.workspace }}/emsdk/emsdk_env.sh
          mkdir cmake-build
          cd cmake-build
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: ${{ github.workspace }}/example/cmake-build
        run: |
          source ${{ github.workspace }}/emsdk/emsdk_env.sh
          make -j `nproc`
